    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        if (!ruffle) return;
        const player = ruffle.createPlayer();
        player.className =
          "mx-auto block aspect-[550/450] w-full max-w-[550px]";
        const container = document.getElementById("jungleoats");
        container.replaceChildren(player);
        player.ruffle().load("/assets/jungleoats.swf");
      });
    </script>
