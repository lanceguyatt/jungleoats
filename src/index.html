<!doctype html>
<html dir="ltr" lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{{ title }}</title>
    <meta
      name="description"
      content="{{ description }}"
    />
    <link rel="canonical" href="{{ url }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="{{ name }}" />
    <meta
      property="og:description"
      content="{{ description }}"
    />
    <meta property="og:url" content="{{ url }}" />
    <meta property="og:image" content="{{ image }}" />
    <meta property="og:image:width" content="492" />
    <meta property="og:image:height" content="492" />
    <meta property="og:site_name" content="{{ name }}" />
    <meta property="og:type" content="website" />
    <meta name="twitter:title" content="{{ name }}" />
    <meta
      name="twitter:description"
      content="{{ description }}"
    />
    <meta name="twitter:image" content="{{ image }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:creator" content="{{ twitter }}" />

    <link rel="icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="author" href="/humans.txt" type="text/plain" />

    <meta name="apple-mobile-web-website-title" content="{{ name }}" />
    <meta name="application-name" content="{{ name }}" />

    <link rel="stylesheet" href="/styles/site.css" />
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        if (!ruffle) return;
        const player = ruffle.createPlayer();
        player.className = "mx-auto block aspect-[550/450] w-full";
        player.setAttribute("role", "application");
        player.setAttribute("aria-label", "{{ name }} game");
        const container = document.getElementById("jungleoats");
        container.replaceChildren(player);
        player.ruffle().load("/assets/jungleoats.swf");
      });
    </script>
    <script
      src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"
      integrity="sha384-6NrmfJx+zTZZPW41eipMGvyVrfvsDKenrh0v/YJ+nJq0WzzLvOHX6GCcQQ1GbIic"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "{{ name }}",
        "description": "{{ description }}",
        "url": "{{ url }}",
        "image": {
          "@type": "ImageObject",
          "contentUrl": "{{ image }}",
          "width": 492,
          "height": 492
        },
        "genre": "Platform game",
        "gamePlatform": "Web browser",
        "playMode": "SinglePlayer",
        "dateCreated": "2005-11-21",
        "datePublished": "2017-03-13",
        "dateModified": "2026-10-28T05:38:24+01:00",
        "author": {
          "@type": "Person",
          "name": "{{ author }}",
          "description": "21st Century Digital Boy",
          "jobTitle": "Web Developer",
          "url": "{{ authorUrl }}"
        }
      }
    </script>
  </head>
  <body class="min-h-dvh bg-sky-300">
    <main class="flex h-full flex-col items-center justify-center">
      <article class="container text-center mx-auto px-6">
        <header>
          <h1 class="text-oats">{{ name }}</h1>
          <p>{{ description }}</p>
        </header>
        <div id="jungleoats">
          <img
            class="mx-auto"
            src="/assets/jungleoats.png"
            width="492"
            height="492"
            alt="Jungle Oats title screen: a monkey on jungle platforms"
          />
        </div>
        <p>
          Click the game to give it keyboard focus. Use the arrow keys to move and the spacebar to
          jump.
        </p>
        <p>Needs a keyboard: best played on desktop.</p>
        <footer>
          <p>Made by <a href="{{ authorUrl }}">{{ author }}</a></p>
        </footer>
      </article>
    </main>
  </body>
</html>
